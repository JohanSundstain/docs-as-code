site_name: Docs as Code

theme:
  name: material

plugins:
  - search

nav:
  - Главная: index.md
  - Проект:
      - Описание: project/overview.md
      - Требования: project/requirements.md
      - Диаграммы: project/diagrams.md
  - API: api/index.md
  - ML:
      - Model Card: ml/model-card.md
      - Data Sheet: ml/dataset.md
      - Риски: ml/risks.md


markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
